# Model price table: USD per 1M tokens.
#
# An entry is added ONLY with a price copied from the provider's official
# pricing page, with that page's URL in `source` and the date it was checked
# in `as_of`. A model that is not listed has an unknown price and the cost
# preview says "price unknown" instead of guessing.
#
# Local / self-hosted models (openai-compat) have no listed price on purpose.
# Prices are standard-tier rates (no batch or cache discounts). Where a
# provider tiers by prompt length, the lowest tier is listed and the higher
# tier is noted in a comment. Prices change; re-check `source` before relying
# on a cost preview, and override with `--pricing PATH` if needed.
#
# Users may supply their own table with `--pricing PATH` (same schema).
#
# Schema:
#   models:
#     <model-name>:
#       input_usd_per_mtok: <number>
#       output_usd_per_mtok: <number>
#       source: <official pricing page URL>
#       as_of: <YYYY-MM-DD>
# Checked 2026-11-15.
# Redirects followed (all first-party):
#   docs.claude.com/.../pricing        -> platform.claude.com/docs/en/about-claude/pricing
#   platform.openai.com/docs/pricing   -> developers.openai.com/api/docs/pricing
#   ai.google.dev/gemini-api/docs/pricing -> aistudio.google.com/docs/pricing
# Anthropic: the pricing page lists display names only; API ids were mapped via
#   https://platform.claude.com/docs/en/about-claude/model-deprecations (model status table).
# Excluded on purpose:
#   Anthropic: claude-sonnet-4-5-20250929 (deprecated, retires 2026-11-30); opus-4-1 / opus-4 / sonnet-4 (retired);
#              claude-mythos-5 / 5-1 / 5-2 (limited availability, not general access; $10/$50, $10/$50, $8/$40);
#              claude-mythos-preview (deprecated).
#   OpenAI:    gpt-5, gpt-5-mini, gpt-5-nano, gpt-5-pro, o3, o3-pro (deprecated, shutdown 2026-12-11);
#              gpt-5.1, gpt-5.4-nano (deprecated, shutdown 2027-04-01);
#              gpt-4o, gpt-4o-mini, gpt-4.1, gpt-4.1-mini (base ids not listed, but every dated snapshot is
#              deprecated with shutdown 2027-01-14 per developers.openai.com/api/docs/deprecations).
#   Google:    gemini-2.5-pro, gemini-2.5-flash (deprecated); native-audio / live / robotics-er models (not general text models).
