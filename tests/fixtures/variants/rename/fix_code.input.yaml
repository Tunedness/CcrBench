id: fix-total
kind: code
language: python
prompt: |
  The following function should return the total price including the tax rate, but it has a bug.
  Fix it and keep the name.

  ```python
  def total_price(items, rate):
      total = 0
      for item in items:
          total += item
      return total * (1 + rate)
  ```
check:
  type: test_command
  command: [python, -m, pytest, -q]
  files:
    test_solution.py: |
      import pytest
      from solution import total_price


      def test_total_price():
          assert total_price([1, 2, 3], 0.5) == pytest.approx(9.0)
