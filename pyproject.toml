[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ccrbench"
dynamic = ["version"]
description = "Cross-Context Review benchmark: tells reasoning from memorization by measuring solution-path diversity across isolated sessions."
readme = { text = "CcrBench", content-type = "text/plain" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "httpx",
    "jinja2",
    "numpy",
    "rapidfuzz",
    "tunedness-embed",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
gemini = ["google-genai"]
all = ["anthropic", "openai", "google-genai"]

[project.scripts]
ccrbench = "ccrbench.cli:app"

[project.entry-points."ccrbench.metrics"]
step_edit_distance = "ccrbench.metrics.edit_distance:StepEditDistance"
embedding_dispersion = "ccrbench.metrics.embedding_dispersion:EmbeddingDispersion"
ast_diff = "ccrbench.metrics.ast_diff:AstDiff"
branching_entropy = "ccrbench.metrics.branching_entropy:BranchingEntropy"

[tool.uv.sources]
tunedness-embed = { git = "https://github.com/Tunedness/TunedEmbed", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.hatch.version]
path = "src/ccrbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccrbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not network and not live and not docker"'
markers = [
    "network: tests that need network access",
    "live: tests that call real provider APIs",
    "docker: tests that need a Docker daemon",
]
